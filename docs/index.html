<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="UTF-8">
        <title>Chess - Bauhaus Style</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
        <style>
            body {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                background-color: #f0f0f0;
                font-family: 'Archivo', sans-serif;
            }
            h1 {
                font-size: 4rem;
                text-transform: uppercase;
                margin-bottom: 20px;
                border-bottom: 8px solid #000;
            }
            #chessboard {
                display: grid;
                grid-template-columns: repeat(8, 60px);
                grid-template-rows: repeat(8, 60px);
                border: 10px solid #000;
                box-shadow: 20px 20px 0px #ffcc00; /* Yellow Bauhaus shadow */
                background-color: #000;
                gap: 2px; /* Bauhaus lines between squares */
            }
            .square {
                width: 60px;
                height: 60px;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 40px;
                transition: transform 0.2s ease;
            }
            .square:hover {
                transform: scale(1.05);
                z-index: 10;
            }
            .selected {
                background-color: #0000ff !important; /* Bauhaus Blue for selection */
                box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            }
            .valid-move {
                position: relative;
            }
            .valid-move::after {
                content: '';
                position: absolute;
                width: 15px;
                height: 15px;
                background-color: rgba(0, 0, 0, 0.3);
                border-radius: 50%;
            }
            .in-check {
                background-color: #ff0000 !important;
                animation: pulse-check 1s infinite alternate;
                box-shadow: inset 0 0 20px #000;
                z-index: 5;
            }
            @keyframes pulse-check {
                from { opacity: 1; }
                to { opacity: 0.6; }
            }
            
            /* Schaakmat animatie Bauhaus */
            #chessboard.style-bauhaus.checkmate .piece-king .shape {
                animation: fade-out-king 2s forwards ease-in-out;
            }
            
            #chessboard.style-bauhaus.checkmate .piece-king .shape::after {
                animation: fade-out-king 2s forwards ease-in-out;
            }

            /* Bord bij schaakmat wordt rustig donkerder */
            #chessboard.checkmate .square {
                transition: background-color 2s ease;
                opacity: 0.7;
            }
            
            #chessboard.checkmate .square:not(.in-check) .piece {
                opacity: 0.5;
                transition: opacity 2s ease;
            }

            @keyframes fade-out-king {
                0% { transform: scale(1); opacity: 1; }
                100% { transform: scale(1.1); opacity: 0; filter: blur(5px); }
            }

            .style-bauhaus .white {
                background-color: #ffcc00; /* Bauhaus Yellow */
            }
            .style-bauhaus .black {
                background-color: #ff0000; /* Bauhaus Red */
            }
            .style-bauhaus #chessboard {
                border: 10px solid #000;
                box-shadow: 20px 20px 0px #ffcc00;
                gap: 2px;
                background-color: #000;
            }

            .piece {
                width: 40px;
                height: 40px;
                display: flex;
                justify-content: center;
                align-items: center;
                cursor: pointer;
                user-select: none;
                transition: transform 0.2s;
                position: relative;
            }
            .white-piece .shape {
                background-color: #0000ff; /* Bauhaus Blue */
                border: 3px solid #000;
            }
            .black-piece .shape {
                background-color: #ffffff; /* White for Black pieces to contrast on Red/Yellow */
                border: 3px solid #000;
            }

            /* Geometrische vormen per stuk (alleen Bauhaus) */
            .style-bauhaus .piece-pawn .shape {
                width: 20px;
                height: 20px;
                border-radius: 50%;
            }
            .style-bauhaus .piece-rook .shape {
                width: 30px;
                height: 30px;
            }
            .style-bauhaus .piece-knight .shape {
                width: 25px;
                height: 35px;
                clip-path: polygon(0% 0%, 70% 0%, 100% 30%, 100% 100%, 0% 100%);
            }
            .style-bauhaus .piece-bishop .shape {
                width: 0;
                height: 0;
                background-color: transparent !important;
                border: none !important;
                border-left: 20px solid transparent;
                border-right: 20px solid transparent;
                border-bottom: 38px solid #000;
                position: relative;
                margin-bottom: 10px;
            }
            .style-bauhaus .piece-bishop .shape::before {
                content: '';
                position: absolute;
                top: 4px;
                left: -16px;
                border-left: 16px solid transparent;
                border-right: 16px solid transparent;
                border-bottom: 30px solid transparent;
                z-index: 1;
            }
            .style-bauhaus .white-piece.piece-bishop .shape::before {
                border-bottom-color: #0000ff;
            }
            .style-bauhaus .black-piece.piece-bishop .shape::before {
                border-bottom-color: #ffffff;
            }
            .style-bauhaus .piece-queen .shape {
                width: 35px;
                height: 35px;
                border-radius: 50%;
            }
            .style-bauhaus .piece-king .shape {
                width: 35px;
                height: 35px;
                position: relative;
            }
            .style-bauhaus .piece-king .shape::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 15px;
                height: 15px;
                background-color: inherit;
                border: 3px solid #000;
            }
            .square:hover .piece {
                transform: scale(1.2) rotate(5deg);
            }
            /* Verwijder de extra accenten om alleen rood en geel te behouden */
            /* Styling for the coordinates (if we add them later) */
            .board-container {
                position: relative;
                padding: 20px;
                background-color: #fff;
                border: 4px solid #000;
            }
            
            /* Layout voor bord en klok */
            .main-container {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 40px;
                position: relative;
                width: fit-content;
            }
            
            .clocks-container {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                height: 520px;
            }
            
            .left-panel, .right-panel {
                display: flex;
                flex-direction: column;
                gap: 20px;
                height: 520px;
            }

            #move-history {
                flex-grow: 1;
                width: 150px;
                background-color: #fff;
                border: 6px solid #000;
                box-shadow: 10px 10px 0px #000;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .history-header {
                background-color: #000;
                color: #fff;
                padding: 5px;
                text-align: center;
                font-weight: bold;
                font-size: 0.9rem;
            }

            #moves-list {
                padding: 10px;
                font-family: monospace;
                font-size: 0.9rem;
                overflow-y: auto;
                max-height: 220px;
            }

            .move-row {
                display: flex;
                justify-content: space-between;
                border-bottom: 1px solid #eee;
                padding: 2px 0;
            }

            .move-number {
                color: #888;
                width: 25px;
            }

            /* Japanse stijl voor zijpaneel */
            .style-japanese #move-history {
                background-color: #fcfaf2;
                border-color: #bc4749;
                box-shadow: 6px 6px 0px #2b2d42;
            }

            .style-japanese .history-header {
                background-color: #bc4749;
            }

            .style-japanese #moves-list {
                color: #2b2d42;
            }

            .clock {
                width: 150px;
                padding: 20px;
                background-color: #fff;
                border: 6px solid #000;
                box-shadow: 10px 10px 0px #000;
                text-align: center;
                transition: all 0.3s ease;
            }
            
            /* Specifieke klok posities */
            #black-clock {
                margin-bottom: auto;
            }
            
            #white-clock {
                margin-top: auto;
            }
            
            .white-timer {
                border-color: #0000ff; /* Blauw voor wit's klok (Bauhaus kleur voor witte stukken) */
            }
            
            .black-timer {
                border-color: #000; /* Zwart voor zwart's klok */
            }
            
            .clock.active {
                transform: scale(1.1);
                box-shadow: 15px 15px 0px #ff0000; /* Rood accent voor actieve beurt */
            }
            
            .clock-label {
                font-size: 1.2rem;
                font-weight: bold;
                margin-bottom: 10px;
                border-bottom: 3px solid #000;
            }
            
            .time {
                font-size: 2.5rem;
                font-weight: bold;
            }
            
            /* Responsive aanpassing voor mobiel */
            @media (max-width: 1000px) {
                .main-container {
                    flex-direction: column;
                    gap: 20px;
                }
                .left-panel, .right-panel {
                    height: auto;
                    flex-direction: row;
                    width: 100%;
                    justify-content: center;
                }
                .clocks-container {
                    height: auto;
                    flex-direction: row;
                    gap: 20px;
                }
                #move-history {
                    width: 100%;
                    max-height: 200px;
                }
            }
            /* Startscherm Overlay */
            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(240, 240, 240, 0.95);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }

            .start-box {
                background-color: #fff;
                border: 10px solid #000;
                padding: 40px;
                box-shadow: 20px 20px 0px #ff0000;
                text-align: center;
            }

            .start-box h2 {
                margin-top: 0;
                font-size: 3rem;
            }

            .welcome-text {
                color: #ff0000;
                border-bottom: 6px solid #000;
                padding-bottom: 10px;
                margin-bottom: 20px !important;
            }

            .style-options {
                display: flex;
                gap: 20px;
                justify-content: center;
                margin-top: 20px;
                margin-bottom: 30px;
            }

            .style-options button {
                padding: 10px 20px;
                font-size: 1.2rem;
                font-family: 'Archivo', sans-serif;
                font-weight: bold;
                background-color: #fff;
                border: 4px solid #000;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .style-options button.selected {
                background-color: #000;
                color: #fff;
            }
            
            .time-options {
                display: flex;
                gap: 20px;
                justify-content: center;
                margin-top: 30px;
            }

            .time-options button {
                padding: 15px 30px;
                font-size: 1.5rem;
                font-family: 'Archivo', sans-serif;
                font-weight: bold;
                background-color: #fff;
                border: 4px solid #000;
                cursor: pointer;
                transition: all 0.2s ease;
                text-transform: uppercase;
            }

            .time-options button:hover {
                transform: scale(1.1);
                box-shadow: 8px 8px 0px #0000ff;
                background-color: #ffcc00;
            }

            .time-options button:active {
                transform: scale(0.95);
            }

            /* Japanse Stijl */
            .style-japanese .white {
                background-color: #fcfaf2; /* Rijstpapier wit */
                background-image: radial-gradient(circle, #fcfaf2 0%, #f4f1de 100%);
            }
            .style-japanese .black {
                background-color: #bc4749; /* Japans rood / vermiljoen */
                background-image: radial-gradient(circle, #bc4749 0%, #a21a1d 100%);
            }
            .style-japanese #chessboard {
                border: 15px solid #2b2d42; /* Donker hout / zwart */
                box-shadow: 0 0 40px rgba(0,0,0,0.4);
                background-color: #2b2d42;
                gap: 2px;
            }
            .style-japanese body {
                background-color: #f4f1de;
                background-image: url('https://www.transparenttextures.com/patterns/paper.png');
                font-family: 'Noto Serif JP', serif;
            }
            .style-japanese .clock {
                background-color: #fcfaf2;
                border: 4px solid #bc4749;
                border-radius: 2px;
                box-shadow: 6px 6px 0px #2b2d42;
                font-family: 'Noto Serif JP', serif;
            }
            .style-japanese .clock.active {
                box-shadow: 0 0 20px #bc4749;
                border-width: 6px;
            }
            .style-japanese .clock-label {
                color: #bc4749;
                border-bottom: 2px solid #2b2d42;
            }
            .style-japanese .overlay {
                background-color: rgba(252, 250, 242, 0.9);
            }
            .style-japanese .start-box {
                background-color: #fcfaf2;
                border: 8px solid #bc4749;
                box-shadow: 20px 20px 0px #2b2d42;
            }
            .style-japanese .welcome-text {
                color: #bc4749;
                font-family: 'Noto Serif JP', serif;
                border-bottom: 3px solid #2b2d42;
            }
            .style-japanese h3 {
                font-family: 'Noto Serif JP', serif;
            }
            .style-japanese .style-options button,
            .style-japanese .time-options button {
                background-color: #fcfaf2;
                color: #2b2d42;
                border: 3px solid #bc4749;
                font-family: 'Noto Serif JP', serif;
                border-radius: 4px;
                text-transform: uppercase;
                font-weight: bold;
            }
            .style-japanese .style-options button.selected {
                background-color: #bc4749;
                color: #fcfaf2;
                border-color: #2b2d42;
            }
            .style-japanese .time-options button:hover {
                background-color: #bc4749;
                color: #fcfaf2;
                transform: scale(1.1);
            }
            .style-japanese .piece {
                filter: drop-shadow(0 4px 5px rgba(0,0,0,0.3));
            }
            .style-japanese .piece:hover {
                transform: scale(1.2) translateY(-10px);
                filter: drop-shadow(0 15px 20px rgba(0,0,0,0.4));
            }

            /* Promotie Overlay */
            .promotion-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(255, 255, 255, 0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 100;
                gap: 15px;
            }

            .promotion-option {
                width: 80px;
                height: 80px;
                background-color: #fff;
                border: 5px solid #000;
                display: flex;
                justify-content: center;
                align-items: center;
                cursor: pointer;
                transition: transform 0.2s;
            }

            .promotion-option:hover {
                transform: scale(1.1);
                background-color: #ffcc00;
            }

            .style-bauhaus .promotion-option {
                box-shadow: 5px 5px 0px #0000ff;
            }

            .style-japanese .promotion-overlay {
                background-color: rgba(252, 250, 242, 0.9);
            }

            .style-japanese .promotion-option {
                border-color: #bc4749;
                background-color: #fcfaf2;
                box-shadow: 4px 4px 0px #2b2d42;
            }

            .style-japanese .promotion-option:hover {
                background-color: #bc4749;
            }
        </style>
    </head>
    <body>

    <div id="start-screen" class="overlay">
        <div class="start-box">
            <h2 class="welcome-text">WELKOM BIJ BAU-SCHAAK</h2>
            
            <h3>KIES STIJL</h3>
            <div class="style-options">
                <button id="btn-bauhaus" class="selected" onclick="selectStyle('bauhaus')">BAUHAUS</button>
                <button id="btn-japanese" onclick="selectStyle('japanese')">JAPANS</button>
            </div>

            <h3>KIES TIJD</h3>
            <div class="time-options">
                <button onclick="startGame(1)">1 MIN</button>
                <button onclick="startGame(3)">3 MIN</button>
                <button onclick="startGame(5)">5 MIN</button>
                <button onclick="startGame(10)">10 MIN</button>
            </div>
        </div>
    </div>


    <div class="main-container">
        <div class="left-panel">
            <div class="clocks-container">
                <div id="black-clock" class="clock black-timer">
                    <div class="clock-label">ZWART</div>
                    <div id="black-time" class="time">10:00</div>
                </div>
                
                <div id="white-clock" class="clock white-timer active">
                    <div class="clock-label">WIT</div>
                    <div id="white-time" class="time">10:00</div>
                </div>
            </div>
        </div>

        <div class="board-container">
            <div id="chessboard"></div>
            <div id="promotion-dialog" class="promotion-overlay" style="display: none;"></div>
        </div>

        <div class="right-panel">
            <div id="move-history">
                <div class="history-header">ZETNOTATIE</div>
                <div id="moves-list"></div>
            </div>
        </div>
    </div>

    <script src="chess.js"></script>
    </body>
</html>
