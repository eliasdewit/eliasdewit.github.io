<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rubik's Pro Timer - Multi-Cube</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --cube-red: #B90000;
            --cube-blue: #0046AD;
            --cube-orange: #FF5800;
            --cube-yellow: #FFD500;
            --cube-green: #009B48;
            --cube-white: #FFFFFF;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--cube-white);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }

        .main-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            flex-direction: column;
        }

        @media (min-width: 900px) { .main-wrapper { flex-direction: row; } }

        .panel {
            background: var(--panel-bg);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 2px solid var(--cube-blue);
        }

        /* Menu Styling */
        .menu-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        select {
            background: #333;
            color: white;
            border: 2px solid var(--cube-blue);
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .left-column { 
            flex: 2; 
            padding: 20px; 
            border-top: 8px solid var(--cube-orange);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
        }

        .right-column { 
            flex: 1; 
            padding: 20px; 
            max-height: 400px; 
            overflow-y: auto; 
            border-top: 8px solid var(--cube-green); 
        }

        @media (min-width: 900px) { .right-column { max-height: 85vh; } }

        #scramble {
            font-size: 1.1em;
            text-align: center;
            color: var(--cube-yellow);
            font-weight: bold;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            min-height: 60px;
        }

        #timer-display {
            font-family: 'Courier New', monospace;
            font-size: 80px;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .timer-ready { color: var(--cube-green) !important; }
        .inspection { color: var(--cube-red); }

        .btn-inspection {
            background: var(--cube-white);
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--cube-yellow); border-bottom: 2px solid #444; padding: 8px; }
        td { padding: 10px 8px; border-bottom: 1px solid #333; }
        
        .is-dnf { color: var(--cube-red) !important; text-decoration: line-through; }
    </style>
</head>
<body>

<div class="menu-bar panel">
    <div style="font-weight: bold; color: var(--cube-yellow);">RUBIK'S PRO TIMER</div>
    <select id="cube-type">
        <option value="2x2">2x2 Cube</option>
        <option value="3x3" selected>3x3 Cube</option>
        <option value="4x4">4x4 Cube</option>
        <option value="pyraminx">Pyraminx</option>
        <option value="megaminx">Megaminx</option>
    </select>
</div>

<div class="main-wrapper">
    <div class="left-column panel" id="timer-zone">
        <div id="scramble">Laden...</div>
        <div id="timer-display">0.00</div>
        <button class="btn-inspection" id="inspect-btn">START INSPECTIE</button>
        <div class="stats-bar">
            <div>Best: <span id="best">0.00</span></div>
            <div>Ao5: <span id="ao5-main">-</span></div>
            <div>Solves: <span id="total-count">0</span></div>
        </div>
        <canvas id="timeChart"></canvas>
    </div>

    <div class="right-column panel">
        <h3 style="margin-top:0; color: var(--cube-green); text-align: center;">LOGS (<span id="current-cube-label">3x3</span>)</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tijd</th>
                    <th>Ao5</th>
                    <th>Acties</th>
                </tr>
            </thead>
            <tbody id="solve-list"></tbody>
        </table>
    </div>
</div>

<script>
    // Data opslag per kubus type
    let allData = JSON.parse(localStorage.getItem('multiCubeData')) || {
        "2x2": [], "3x3": [], "4x4": [], "pyraminx": [], "megaminx": []
    };
    
    let currentType = "3x3";
    let chart;
    let startTime, timerInterval, insInterval, isRunning = false, isReady = false, isInspecting = false;

    const display = document.getElementById('timer-display');
    const inspectBtn = document.getElementById('inspect-btn');
    const timerZone = document.getElementById('timer-zone');
    const cubeSelect = document.getElementById('cube-type');

    // SCRAMBLE GENERATOR
    function generateScramble() {
        const moves = {
            "2x2": ["U", "R", "F"],
            "3x3": ["U", "D", "L", "R", "F", "B"],
            "4x4": ["U", "D", "L", "R", "F", "B", "Uw", "Dw", "Lw", "Rw", "Fw", "Bw"],
            "pyraminx": ["U", "L", "R", "B"],
            "megaminx": ["R++", "R--", "D++", "D--", "U"]
        };
        
        const lengths = { "2x2": 9, "3x3": 20, "4x4": 40, "pyraminx": 10, "megaminx": 50 };
        const modifiers = ["", "'", "2"];
        
        let type = currentType;
        let scramble = [];
        let lastMove = "";

        if (type === "megaminx") {
            for(let i=0; i<lengths[type]; i++) {
                let move = moves[type][Math.floor(Math.random() * 4)];
                if (i % 10 === 0 && i !== 0) scramble.push("U\n");
                else scramble.push(move);
            }
        } else {
            for (let i = 0; i < lengths[type]; i++) {
                let move = moves[type][Math.floor(Math.random() * moves[type].length)];
                while (move === lastMove) move = moves[type][Math.floor(Math.random() * moves[type].length)];
                let mod = (type === "pyraminx" && Math.random() > 0.5) ? "" : modifiers[Math.floor(Math.random() * 3)];
                scramble.push(move + mod);
                lastMove = move;
            }
        }
        document.getElementById('scramble').innerText = scramble.join(" ");
    }

    // WISSELEN VAN KUBUS
    cubeSelect.addEventListener('change', (e) => {
        currentType = e.target.value;
        document.getElementById('current-cube-label').innerText = currentType;
        saveAndRefresh();
        generateScramble();
    });

    function initChart() {
        const ctx = document.getElementById('timeChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Tijd', data: [], borderColor: '#0046AD', tension: 0.3 }] },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
        saveAndRefresh();
        generateScramble();
    }

    // TIMER LOGICA (Spatie + Touch)
    function handleActionStart() {
        if (isInspecting) {
            isInspecting = false; clearInterval(insInterval);
            isReady = true; display.innerText = "0.00";
            display.classList.add('timer-ready');
        } else if (!isRunning && !isReady) {
            isReady = true; display.innerText = "0.00";
            display.classList.add('timer-ready');
        } else if (isRunning) {
            stopTimer();
        }
    }

    function handleActionEnd() {
        if (isReady && !isRunning) startTimer();
    }

    window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); handleActionStart(); } });
    window.addEventListener('keyup', (e) => { if (e.code === 'Space') handleActionEnd(); });
    timerZone.addEventListener('mousedown', (e) => { if (e.target.tagName !== 'BUTTON') handleActionStart(); });
    window.addEventListener('mouseup', handleActionEnd);
    timerZone.addEventListener('touchstart', (e) => { if (e.target.tagName !== 'BUTTON') { e.preventDefault(); handleActionStart(); } });
    window.addEventListener('touchend', handleActionEnd);

    inspectBtn.onclick = (e) => { e.stopPropagation(); inspectBtn.blur(); startInspection(); };

    function startInspection() {
        isInspecting = true; let count = 15;
        display.classList.add('inspection');
        display.innerText = count;
        insInterval = setInterval(() => {
            count--;
            if (count <= 0) { clearInterval(insInterval); startTimer(); }
            else display.innerText = count;
        }, 1000);
    }

    function startTimer() {
        isRunning = true; isReady = false; isInspecting = false;
        display.classList.remove('timer-ready', 'inspection');
        startTime = performance.now();
        timerInterval = setInterval(() => {
            display.innerText = ((performance.now() - startTime) / 1000).toFixed(2);
        }, 10);
    }

    function stopTimer() {
        isRunning = false; clearInterval(timerInterval);
        allData[currentType].push({ time: parseFloat(display.innerText), dnf: false });
        saveAndRefresh();
        generateScramble();
    }

    function deleteSolve(idx) {
        allData[currentType].splice(idx, 1);
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('multiCubeData', JSON.stringify(allData));
        let currentSolves = allData[currentType];
        
        // Update Chart
        chart.data.labels = currentSolves.map((_, i) => i + 1);
        chart.data.datasets[0].data = currentSolves.map(s => s.time);
        chart.update();

        // Update List
        const listBody = document.getElementById('solve-list');
        listBody.innerHTML = "";
        currentSolves.forEach((s, i) => {
            const row = `<tr>
                <td>${i + 1}</td>
                <td>${s.time.toFixed(2)}</td>
                <td>-</td>
                <td><button onclick="deleteSolve(${i})">×</button></td>
            </tr>`;
            listBody.insertAdjacentHTML('afterbegin', row);
        });

        // Stats
        const times = currentSolves.map(s => s.time);
        document.getElementById('best').innerText = times.length ? Math.min(...times).toFixed(2) : "0.00";
        document.getElementById('total-count').innerText = times.length;
    }

    initChart();
</script>

</body>
</html>
