<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rubik's Pro Timer online</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --cube-red: #B90000;
            --cube-blue: #0046AD;
            --cube-orange: #FF5800;
            --cube-yellow: #FFD500;
            --cube-green: #009B48;
            --cube-white: #FFFFFF;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--cube-white);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }

        .main-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            flex-direction: column;
        }

        @media (min-width: 900px) { .main-wrapper { flex-direction: row; } }

        .panel {
            background: var(--panel-bg);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 2px solid var(--cube-blue);
        }

        .left-column { 
            flex: 2; 
            padding: 20px; 
            border-top: 8px solid var(--cube-orange);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
        }

        .right-column { 
            flex: 1; 
            padding: 20px; 
            max-height: 400px; 
            overflow-y: auto; 
            border-top: 8px solid var(--cube-green); 
        }

        @media (min-width: 900px) { .right-column { max-height: 85vh; } }

        #scramble {
            font-size: 1.1em;
            text-align: center;
            color: var(--cube-yellow);
            font-weight: bold;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            min-height: 50px;
            line-height: 1.4;
        }

        #timer-display {
            font-family: 'Courier New', monospace;
            font-size: 80px;
            text-align: center;
            margin: 30px 0;
            font-weight: bold;
        }

        @media (min-width: 600px) { #timer-display { font-size: 120px; } }

        .timer-ready { color: var(--cube-green) !important; text-shadow: 0 0 20px var(--cube-green); }
        .inspection { color: var(--cube-red); }

        .btn-inspection {
            background: var(--cube-white);
            color: black;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 auto 20px;
            font-size: 1.1em;
            transition: transform 0.1s;
        }
        .btn-inspection:active { transform: scale(0.95); }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--cube-yellow);
        }

        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th { text-align: left; color: var(--cube-yellow); border-bottom: 2px solid #444; padding: 10px; }
        td { padding: 12px 10px; border-bottom: 1px solid #333; }
        
        .action-btns { display: flex; gap: 5px; }
        .plus2-btn { background: var(--cube-orange); border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .dnf-btn { background: var(--cube-red); border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .delete-btn { background: transparent; color: #666; border: none; cursor: pointer; font-size: 1.2em; padding-left: 10px; }
        
        .is-dnf { color: var(--cube-red) !important; text-decoration: line-through; }
        .is-penalty { color: var(--cube-orange) !important; }

        canvas { background: #111; border-radius: 10px; padding: 10px; width: 100% !important; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="left-column panel" id="timer-zone">
        <div id="scramble">Laden...</div>
        <div id="timer-display">0.00</div>
        <button class="btn-inspection" id="inspect-btn">START INSPECTIE</button>
        <div class="stats-bar">
            <div class="stat-item"><div class="stat-label">Best</div><div id="best">0.00</div></div>
            <div class="stat-item"><div class="stat-label">Ao5</div><div id="ao5-main">-</div></div>
            <div class="stat-item"><div class="stat-label">Solves</div><div id="total-count">0</div></div>
        </div>
        <canvas id="timeChart"></canvas>
    </div>

    <div class="right-column panel">
        <h3 style="margin-top:0; color: var(--cube-green); text-align: center;">SESSIE LOGS</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tijd</th>
                    <th>Ao5</th>
                    <th>Ao12</th>
                    <th>Acties</th>
                </tr>
            </thead>
            <tbody id="solve-list"></tbody>
        </table>
    </div>
</div>

<script>
    let solves = JSON.parse(localStorage.getItem('cubeDataV7')) || [];
    let chart;
    let startTime, timerInterval, insInterval, isRunning = false, isReady = false, isInspecting = false;
    
    const display = document.getElementById('timer-display');
    const inspectBtn = document.getElementById('inspect-btn');
    const timerZone = document.getElementById('timer-zone');

    function generateScramble() {
        const moves = ["U", "D", "L", "R", "F", "B"];
        const modifiers = ["", "'", "2"];
        let scramble = [];
        let lastMove = "";
        for (let i = 0; i < 20; i++) {
            let move = moves[Math.floor(Math.random() * moves.length)];
            while (move === lastMove) move = moves[Math.floor(Math.random() * moves.length)];
            scramble.push(move + modifiers[Math.floor(Math.random() * modifiers.length)]);
            lastMove = move;
        }
        document.getElementById('scramble').innerText = scramble.join(" ");
    }

    function initChart() {
        const ctx = document.getElementById('timeChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: solves.map((_, i) => i + 1),
                datasets: [{
                    label: 'Tijd',
                    data: solves.map(s => s.dnf ? null : s.time),
                    borderColor: '#0046AD',
                    backgroundColor: 'rgba(0, 70, 173, 0.2)',
                    tension: 0.3,
                    fill: true,
                    spanGaps: false
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
        renderUI();
        generateScramble();
    }

    // CORE TIMER LOGICA
    function handleActionStart() {
        if (isInspecting) {
            isInspecting = false;
            clearInterval(insInterval);
            isReady = true;
            display.innerText = "0.00";
            display.classList.remove('inspection');
            display.classList.add('timer-ready');
        } else if (!isRunning && !isReady) {
            isReady = true;
            display.innerText = "0.00";
            display.classList.add('timer-ready');
        } else if (isRunning) {
            stopTimer();
        }
    }

    function handleActionEnd() {
        if (isReady && !isRunning) {
            startTimer();
        }
    }

    // Luister naar Spatiebalk (Global)
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault(); 
            handleActionStart();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
            handleActionEnd();
        }
    });

    // Luister naar Muis/Touch op de Timer Zone
    timerZone.addEventListener('mousedown', (e) => {
        if (e.target.tagName !== 'BUTTON') handleActionStart();
    });
    window.addEventListener('mouseup', handleActionEnd);

    timerZone.addEventListener('touchstart', (e) => {
        if (e.target.tagName !== 'BUTTON') {
            e.preventDefault();
            handleActionStart();
        }
    }, {passive: false});
    window.addEventListener('touchend', handleActionEnd);

    // Inspectie Knop
    inspectBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        inspectBtn.blur(); // VERWIJDER FOCUS VAN DE KNOP (Cruciaal voor spatiebalk!)
        startInspection();
    });

    function startInspection() {
        if (isRunning || isInspecting) return;
        isInspecting = true;
        let count = 15;
        display.classList.add('inspection');
        display.classList.remove('timer-ready');
        display.innerText = count;
        insInterval = setInterval(() => {
            count--;
            if (count <= 0) {
                clearInterval(insInterval);
                if (isInspecting) startTimer();
            } else { display.innerText = count; }
        }, 1000);
    }

    function startTimer() {
        isRunning = true; isReady = false; isInspecting = false;
        display.classList.remove('timer-ready', 'inspection');
        startTime = performance.now();
        timerInterval = setInterval(() => {
            display.innerText = ((performance.now() - startTime) / 1000).toFixed(2);
        }, 10);
    }

    function stopTimer() {
        isRunning = false;
        clearInterval(timerInterval);
        const finalTime = parseFloat(display.innerText);
        solves.push({ time: finalTime, penalty: false, dnf: false });
        saveAndRefresh();
        generateScramble();
    }

    // Penalty & UI functies
    function applyPenalty(index) {
        if (!solves[index].penalty && !solves[index].dnf) {
            solves[index].time += 2;
            solves[index].penalty = true;
            saveAndRefresh();
        }
    }

    function applyDNF(index) {
        if (!solves[index].dnf) {
            solves[index].dnf = true;
            saveAndRefresh();
        }
    }

    function deleteSolve(index) {
        solves.splice(index, 1);
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('cubeDataV7', JSON.stringify(solves));
        chart.data.labels = solves.map((_, i) => i + 1);
        chart.data.datasets[0].data = solves.map(s => s.dnf ? null : s.time);
        chart.update();
        renderUI();
    }

    function calcAo(array, count, index) {
        if (index + 1 < count) return "-";
        const subset = array.slice(index + 1 - count, index + 1);
        if (subset.some(s => s.dnf)) return "DNF";
        const sum = subset.reduce((a, b) => a + b.time, 0);
        return (sum / count).toFixed(2);
    }

    function renderUI() {
        const listBody = document.getElementById('solve-list');
        listBody.innerHTML = "";
        solves.forEach((s, i) => {
            const row = `<tr>
                <td>${i + 1}</td>
                <td style="font-weight:bold" class="${s.dnf ? 'is-dnf' : (s.penalty ? 'is-penalty' : '')}">
                    ${s.dnf ? 'DNF' : s.time.toFixed(2) + (s.penalty ? '+' : '')}
                </td>
                <td>${calcAo(solves, 5, i)}</td>
                <td>${calcAo(solves, 12, i)}</td>
                <td class="action-btns">
                    <button class="plus2-btn" onclick="event.stopPropagation(); applyPenalty(${i})" ${s.penalty || s.dnf ? 'disabled' : ''}>+2</button>
                    <button class="dnf-btn" onclick="event.stopPropagation(); applyDNF(${i})" ${s.dnf ? 'disabled' : ''}>DNF</button>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteSolve(${i})">×</button>
                </td>
            </tr>`;
            listBody.insertAdjacentHTML('afterbegin', row);
        });

        const validTimes = solves.filter(s => !s.dnf).map(s => s.time);
        if (validTimes.length > 0) {
            document.getElementById('best').innerText = Math.min(...validTimes).toFixed(2) + "s";
            document.getElementById('total-count').innerText = solves.length;
            document.getElementById('ao5-main').innerText = calcAo(solves, 5, solves.length - 1);
        }
    }

    initChart();
</script>

</body>
</html>
